<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DK Core: tres protocolos, listen, build y guide, convergiendo en un nucleo central">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC7357" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#EC7357" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="419" rx="8" fill="#0B0D13" stroke="#F5F1EA" stroke-opacity="0.1"/>

  <text x="28" y="34" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#EC7357">DK · CORE</text>
  <circle cx="818" cy="29" r="3.5" fill="#7DD3B0">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="830" y="33.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1" fill="#A7B0BE">STATUS: LIVE</text>

  <g stroke="#F5F1EA" stroke-opacity="0.32" stroke-width="1.25" fill="none">
    <line x1="450" y1="160" x2="450" y2="145" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="395" y1="190" x2="390" y2="280" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="505" y1="190" x2="510" y2="280" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <circle cx="450" cy="190" r="42" fill="url(#coreGlow)">
    <animate attributeName="r" values="42;52;42" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <polygon points="411,160 489,160 505,190 489,220 411,220 395,190" fill="#EC7357" fill-opacity="0.08" stroke="#F5F1EA" stroke-width="1.5"/>
  <text x="450" y="185" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F1EA">DK</text>
  <text x="450" y="200" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" letter-spacing="1.5" fill="#A7B0BE">CORE</text>

  <g>
    <polygon points="330,55 570,55 600,100 570,145 330,145 300,100" fill="#7DD3B0" fill-opacity="0.055" stroke="#7DD3B0" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </polygon>
    <text x="450" y="93" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="700" fill="#F5F1EA">LISTEN</text>
    <text x="450" y="114" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#A7B0BE">read the real ask · ONLINE</text>
  </g>

  <g>
    <polygon points="138,238 362,238 390,280 362,322 138,322 110,280" fill="#7DD3B0" fill-opacity="0.055" stroke="#7DD3B0" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite"/>
    </polygon>
    <text x="250" y="273" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="700" fill="#F5F1EA">BUILD</text>
    <text x="250" y="294" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#A7B0BE">backend + IA aplicada · ONLINE</text>
  </g>

  <g>
    <polygon points="538,238 762,238 790,280 762,322 538,322 510,280" fill="#EC7357" fill-opacity="0.045" stroke="#EC7357" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="650" y="273" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="700" fill="#F5F1EA">GUIDE</text>
    <text x="650" y="294" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.5" fill="#A7B0BE">alinear al equipo · STANDBY</text>
  </g>

  <text x="28" y="380" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#8B96A7">PROTOCOL  <tspan fill="#7DD3B0">listen</tspan> -&gt; understand -&gt; <tspan fill="#7DD3B0">build</tspan></text>
  <text x="28" y="398" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#8B96A7">GUIDE     <tspan fill="#EC7357">standby</tspan> — listo para liderar cuando toque</text>
</svg>
